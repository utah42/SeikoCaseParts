<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>精工中古表款 外壳 - 表镜 - 表冠 型号查询</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f6f8;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --line: #d1d5db;
      --accent: #1f2937;
      --hit-bg: #fff7d1;
      --hit-mark: #facc15;
      --warn: #b45309;
      --radius: 12px;
      --pad: clamp(12px, 3vw, 28px);
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", "Microsoft YaHei", "Yu Gothic", sans-serif;
      color: var(--text);
      background: linear-gradient(180deg, #eef1f5 0%, var(--bg) 180px);
      padding: var(--pad);
    }
    .wrap { width: min(960px, 100%); margin: 0 auto; }
    .top {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 12px 16px;
      align-items: flex-start;
      margin-bottom: 14px;
    }
    h1 {
      margin: 0;
      font-size: clamp(16px, 4.2vw, 22px);
      line-height: 1.35;
      font-weight: 700;
      max-width: 42rem;
      flex: 1 1 220px;
    }
    .langs { display: flex; gap: 8px; flex-shrink: 0; }
    .langs button {
      min-width: 44px; min-height: 36px;
      padding: 6px; cursor: pointer; line-height: 0;
      border: 1px solid var(--line); background: var(--card); border-radius: 8px;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .langs button svg { width: 30px; height: 20px; display: block; border-radius: 2px; box-shadow: 0 0 0 1px rgba(0,0,0,.08); }
    .langs button.active { outline: 2px solid var(--accent); outline-offset: 1px; background: #f3f4f6; }
    .panel {
      background: var(--card);
      border: 1px solid #e5e7eb;
      border-radius: var(--radius);
      box-shadow: 0 8px 24px rgba(15, 23, 42, .06);
      padding: clamp(12px, 2.5vw, 18px);
      margin-bottom: 16px;
    }
    .bar {
      display: grid;
      grid-template-columns: auto auto minmax(0, 1fr) auto;
      gap: 10px 12px;
      align-items: end;
    }
    .field, .eq, .query-btn { display: flex; flex-direction: column; gap: 6px; }
    .input-row { display: contents; }
    .eq { align-items: center; justify-content: flex-end; padding-bottom: 10px; }
    .eq span { font-size: 18px; font-weight: 700; color: var(--muted); line-height: 1; }
    .lbl { font-size: 13px; color: var(--muted); }
    select, input[type="text"], #btn {
      font: inherit;
      font-size: 16px;
      min-height: 44px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--text);
    }
    select { min-width: 7.5rem; max-width: 100%; }
    input[type="text"] { width: 100%; min-width: 0; }
    #btn {
      cursor: pointer;
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
      font-weight: 600;
      padding-inline: 18px;
      white-space: nowrap;
    }
    #btn:active { transform: translateY(1px); }
    .meta { color: var(--muted); font-size: 13px; margin: 0 0 10px; }
    .empty { color: var(--warn); font-size: 16px; margin: 0; padding: 8px 2px; }
    .table-wrap {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--card);
    }
    table { border-collapse: collapse; width: 100%; min-width: 480px; }
    th, td {
      border-bottom: 1px solid #e5e7eb;
      border-right: 1px solid #eef0f3;
      padding: 10px 12px;
      text-align: left;
      font-family: Consolas, "MS Gothic", ui-monospace, monospace;
      font-size: 14px;
      word-break: break-word;
    }
    th:last-child, td:last-child { border-right: none; }
    tr:last-child td { border-bottom: none; }
    th { background: #f3f4f6; position: sticky; top: 0; z-index: 1; font-weight: 600; }
    td.hit-col { background: var(--hit-bg); }
    mark.hit { background: var(--hit-mark); color: #111827; padding: 0 1px; border-radius: 2px; font-weight: 700; }

    @media (max-width: 720px) {
      .bar {
        display: flex;
        flex-direction: column;
        gap: 12px;
        align-items: stretch;
      }
      .field select {
        width: auto;
        max-width: 12rem;
        min-width: 8rem;
      }
      .input-row {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        min-width: 0;
      }
      .eq {
        flex: 0 0 auto;
        padding-bottom: 0;
        align-self: center;
      }
      .query-input {
        flex: 1 1 auto;
        min-width: 0;
      }
      .query-input input[type="text"] {
        width: 100%;
        font-size: 15px;
      }
      #btn { width: 100%; }
      .langs button { min-width: 48px; min-height: 40px; }
    }
  </style>
</head>

      const field = document.getElementById("keyType").value;
      const pack = I18N[lang];
      const key = field === "glass" ? "placeholderGlass" : (field === "crown" ? "placeholderCrown" : "placeholderCase");
      document.getElementById("keyValue").placeholder = pack[key];
    }

    function applyLang(next) {
      lang = next;
      localStorage.setItem("seiko_query_lang", lang);
      const pack = I18N[lang];
      document.documentElement.lang = pack.htmlLang;
      document.title = pack.title;
      document.querySelectorAll("[data-i18n]").forEach(function (el) {
        el.textContent = pack[el.getAttribute("data-i18n")];
      });
      updatePlaceholder();
      document.querySelectorAll(".langs button").forEach(function (btn) {
        btn.classList.toggle("active", btn.getAttribute("data-lang") === lang);
      });
      if (lastHits !== null) render(lastHits, lastField, lastQ);
    }

    function render(hits, field, q) {
      lastHits = hits;
      lastField = field;
      lastQ = q;
      const out = document.getElementById("out");
      if (!hits.length) {
        out.innerHTML = '<p class="empty">' + t("empty") + "</p>";
        return;
      }
      const nCase = new Set(hits.map(function (r) { return r.case; }).filter(Boolean)).size;
      const nGlass = new Set(hits.map(function (r) { return r.glass; }).filter(Boolean)).size;
      const nCrown = new Set(hits.map(function (r) { return r.crown; }).filter(Boolean)).size;
      const body = hits.map(function (r) {
        return "<tr>" +
          cell(r.case, "case", field, q) +
          cell(r.glass, "glass", field, q) +
          cell(r.crown, "crown", field, q) +
          "</tr>";
      }).join("");
      out.innerHTML =
        '<div class="table-wrap"><table><thead><tr>' +
        "<th>" + t("thCase") + " (" + nCase + ")</th>" +
        "<th>" + t("thGlass") + " (" + nGlass + ")</th>" +
        "<th>" + t("thCrown") + " (" + nCrown + ")</th>" +
        "</tr></thead><tbody>" + body + "</tbody></table></div>";
    }

    function onQuery() {
      const field = document.getElementById("keyType").value;
      const q = compact(document.getElementById("keyValue").value);
      if (!q) {
        render([], field, q);
        return;
      }
      render(ROWS.filter(function (row) { return matches(row, field, q); }), field, q);
    }

    document.getElementById("btn").addEventListener("click", onQuery);
    document.getElementById("keyValue").addEventListener("keydown", function (e) {
      if (e.key === "Enter") onQuery();
    });
    document.getElementById("keyType").addEventListener("change", updatePlaceholder);
    document.querySelectorAll(".langs button").forEach(function (btn) {
      btn.addEventListener("click", function () {
        applyLang(btn.getAttribute("data-lang"));
      });
    });
    applyLang(localStorage.getItem("seiko_query_lang") || "zh");
  </script>
</body>
</html>
